name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK
        # pytest is named explicitly. It used to be present because the GitHub
        # runner image happened to ship it, so this job began failing with
        # "No module named pytest" on a runner update, without a commit here.
        run: pip install -e python/ pytest

      - name: Run tests
        run: python -m pytest tests/test_client.py -q

  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and test
        working-directory: typescript
        run: |
          npm ci
          npm test

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        working-directory: go
        run: go test ./...

  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Test
        working-directory: java
        run: mvn test -q

  test-langchain-plugin:
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test
        run: |
          pip install -e python/ pytest
          pip install langchain-core
          pip install -e plugins/langchain/
          python -m pytest plugins/langchain/tests/ -q

  # The framework plugins whose tests stub their framework rather than install
  # it, which is how every plugin here is tested. One job over a matrix: the
  # install and the command are identical, only the directory differs.
  test-framework-plugins:
    runs-on: ubuntu-latest
    needs: test-python
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - agno
          - google-adk
          - haystack
          - letta
          - openai-agents
          - pydantic-ai
          - smolagents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test
        run: |
          pip install -e python/ pytest pytest-asyncio
          # --no-deps: the framework is stubbed in the tests, not installed.
          pip install -e plugins/${{ matrix.plugin }}/ --no-deps
          python -m pytest plugins/${{ matrix.plugin }}/tests/ -q

  test-agent-plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: plugins/agent
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: plugins/agent
        run: |
          pip install ruff
          ruff check zentinelle_agent/

      - name: Test imports
        working-directory: plugins/agent
        run: |
          python -c "from zentinelle_agent.cli import main; print('CLI import OK')"
          python -c "from zentinelle_agent.proxy import ProxyServer; print('Proxy import OK')"

      - name: Test CLI help
        working-directory: plugins/agent
        run: |
          python -m zentinelle_agent.cli --help
          python -m zentinelle_agent.cli proxy --help
