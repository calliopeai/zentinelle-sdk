name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK
        run: pip install -e python/

      - name: Run tests
        run: python -m pytest tests/test_client.py -q

  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and test
        working-directory: typescript
        run: |
          npm ci
          npm test

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        working-directory: go
        run: go test ./...

  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Test
        working-directory: java
        run: mvn test -q

  test-langchain-plugin:
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test
        run: |
          pip install -e python/
          pip install langchain-core
          pip install -e plugins/langchain/
          python -m pytest plugins/langchain/tests/ -q

  test-openai-agents-plugin:
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test
        run: |
          pip install -e python/
          pip install pytest-asyncio
          # --no-deps: the tests stub the Agents SDK rather than install it,
          # the way every other plugin here is tested.
          pip install -e plugins/openai-agents/ --no-deps
          python -m pytest plugins/openai-agents/tests/ -q

  test-agent-plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: plugins/agent
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: plugins/agent
        run: |
          pip install ruff
          ruff check zentinelle_agent/

      - name: Test imports
        working-directory: plugins/agent
        run: |
          python -c "from zentinelle_agent.cli import main; print('CLI import OK')"
          python -c "from zentinelle_agent.proxy import ProxyServer; print('Proxy import OK')"

      - name: Test CLI help
        working-directory: plugins/agent
        run: |
          python -m zentinelle_agent.cli --help
          python -m zentinelle_agent.cli proxy --help
