[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zentinelle-dspy"
version = "0.1.0"
description = "Zentinelle integration for DSPy - AI Agent Governance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Calliope Labs", email = "engineering@calliope.ai" }
]
keywords = [
    "agents",
    "ai",
    "dspy",
    "governance",
    "guardrails",
    "prompt-optimization",
    "stanford",
    "zentinelle",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "zentinelle>=0.1.0",
    "dspy>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://zentinelle.ai"
Documentation = "https://docs.zentinelle.ai/integrations/dspy"
Repository = "https://github.com/calliopeai/zentinelle-sdk"
DSPy = "https://github.com/stanfordnlp/dspy"

[tool.hatch.build.targets.wheel]
packages = ["zentinelle_dspy"]
