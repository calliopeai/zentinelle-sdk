[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zentinelle-agent"
version = "0.1.0"
description = "Zentinelle agent integration - governance, policy enforcement, and audit for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Calliope Labs", email = "engineering@calliope.ai" }
]
keywords = [
    "ai",
    "agents",
    "governance",
    "guardrails",
    "zentinelle",
    "claude-code",
    "codex",
    "gemini",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24.0",
]

[project.scripts]
zentinelle-agent = "zentinelle_agent.cli:main"

[project.urls]
Homepage = "https://zentinelle.ai"
Documentation = "https://docs.zentinelle.ai/integrations/agent"
Repository = "https://github.com/calliopeai/zentinelle-sdk"

[tool.hatch.build.targets.wheel]
packages = ["zentinelle_agent"]

[tool.hatch.build.targets.wheel.sources]
"zentinelle_agent/skill" = "zentinelle_agent/skill"

[tool.ruff]
target-version = "py39"
# 120, matching the wider Calliope Python convention.
line-length = 120

[tool.ruff.lint]
# Selected explicitly. Relying on a linter's default rule set is exactly as
# unstable as not pinning its version: ruff widened its defaults, and this
# job went red on every branch when it did, with no commit to blame (#28).
#
# E/F are the real bugs — undefined names, unused imports, syntax-adjacent
# mistakes. I is import ordering. The rest of ruff's current defaults are
# stylistic judgments about this plugin's error handling (BLE001, S110,
# SIM117) or its file conventions (EXE001, FA102). Those may well be worth
# adopting, but as a deliberate decision, not inherited from a version bump.
select = ["E", "F", "I"]
